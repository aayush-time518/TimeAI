<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Time AI | Enterprise Intelligence</title>
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              mono: ['JetBrains Mono', 'monospace'],
            },
            colors: {
              tva: {
                dark: '#ffffff', // Pure White
                panel: '#f8fafc', // Very Light Gray (Slate 50)
                amber: '#f59e0b', // Amber 500
                orange: '#dc2626', // Swiss Red
                blue: '#0f172a', // Slate 900
                cream: '#334155', // Slate 700
                void: '#020617', // Slate 950
              }
            },
            transitionTimingFunction: {
              'out-expo': 'cubic-bezier(0.19, 1, 0.22, 1)',
              'luxury': 'cubic-bezier(0.16, 1, 0.3, 1)', 
              'elastic': 'cubic-bezier(0.68, -0.55, 0.265, 1.55)',
            },
            animation: {
              'float': 'float 6s ease-in-out infinite',
              'breathe': 'breathe 4s ease-in-out infinite',
              'hover-idle': 'hoverIdle 4s ease-in-out infinite',
              'spin-slow': 'spin 60s linear infinite',
              'spin-fast': 'spin 1s linear infinite',
              'shimmer': 'shimmer 3s linear infinite',
              'enter-view': 'enterView 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards',
              'walk-cycle': 'walkCycle 0.6s linear infinite',
              'walk-bounce': 'walkBounce 0.6s cubic-bezier(0.4, 0, 0.2, 1) infinite',
              'blink': 'blink 4s infinite',
              'eye-scan': 'eyeScan 5s infinite',
              'glitch': 'glitch 0.2s cubic-bezier(.25, .46, .45, .94) both infinite',
              'recoil': 'recoil 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275)',
              'pop-in': 'popIn 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55) forwards',
              'beam-pulse': 'beamPulse 0.05s linear infinite',
              'scan-sweep': 'scanSweep 2s ease-in-out infinite alternate',
              'shake': 'shake 0.4s cubic-bezier(.36,.07,.19,.97) both',
              'float-bubble': 'floatBubble 2s ease-out forwards',
              'lock-on': 'lockOn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards',
              'scan-vertical': 'scanVertical 1.5s linear infinite',
              'success-float': 'successFloat 1s cubic-bezier(0.16, 1, 0.3, 1) forwards',
            },
            keyframes: {
              enterView: {
                '0%': { opacity: 0, transform: 'translateY(10px)' },
                '100%': { opacity: 1, transform: 'translateY(0)' },
              },
              float: {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-15px)' },
              },
              breathe: {
                '0%, 100%': { transform: 'scale(1)' },
                '50%': { transform: 'scale(1.03)' },
              },
              hoverIdle: {
                 '0%, 100%': { transform: 'translateY(0) rotate(0deg)' },
                 '50%': { transform: 'translateY(-5px) rotate(1deg)' },
              },
              shimmer: {
                '0%': { backgroundPosition: '200% 0' },
                '100%': { backgroundPosition: '-200% 0' }
              },
              walkCycle: {
                '0%': { transform: 'rotate(0deg)' },
                '25%': { transform: 'rotate(2deg)' },
                '50%': { transform: 'rotate(0deg)' },
                '75%': { transform: 'rotate(-2deg)' },
                '100%': { transform: 'rotate(0deg)' },
              },
              walkBounce: {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-12px)' }, 
              },
              blink: {
                '0%, 48%, 52%, 100%': { transform: 'scaleY(1)' },
                '50%': { transform: 'scaleY(0.1)' },
              },
              eyeScan: {
                '0%, 45%, 55%, 100%': { transform: 'translate(0,0)' },
                '48%': { transform: 'translate(-3px, 0)' },
                '52%': { transform: 'translate(3px, 0)' }, 
              },
              scanSweep: {
                '0%': { transform: 'rotate(-25deg)', opacity: 0.2 },
                '100%': { transform: 'rotate(5deg)', opacity: 0.5 },
              },
              glitch: {
                '0%': { transform: 'translate(0)' },
                '20%': { transform: 'translate(-4px, 4px)' },
                '40%': { transform: 'translate(-4px, -4px)' },
                '60%': { transform: 'translate(4px, 4px)' },
                '80%': { transform: 'translate(4px, -4px)' },
                '100%': { transform: 'translate(0)' }
              },
              recoil: {
                '0%': { transform: 'translateX(0) scale(1)' },
                '30%': { transform: 'translateX(-20px) scale(0.9) rotate(-10deg)' },
                '100%': { transform: 'translateX(0) scale(1)' }
              },
              popIn: {
                '0%': { opacity: 0, transform: 'scale(0.5)' },
                '70%': { transform: 'scale(1.1)' },
                '100%': { opacity: 1, transform: 'scale(1)' }
              },
              beamPulse: {
                '0%': { opacity: 0.8, filter: 'brightness(1) blur(1px)' },
                '100%': { opacity: 1, filter: 'brightness(2) blur(2px)' }
              },
              beamFire: {
                '0%': { strokeDasharray: '0 100', strokeDashoffset: '0' },
                '100%': { strokeDasharray: '100 0', strokeDashoffset: '0' }
              },
              shockwave: {
                '0%': { transform: 'scale(0)', opacity: 1 },
                '100%': { transform: 'scale(2)', opacity: 0 }
              },
              shake: {
                '0%, 100%': { transform: 'translate3d(0, 0, 0)' },
                '10%, 30%, 50%, 70%, 90%': { transform: 'translate3d(-4px, 0, 0)' },
                '20%, 40%, 60%, 80%': { transform: 'translate3d(4px, 0, 0)' }
              },
              floatBubble: {
                '0%': { opacity: 0, transform: 'translateY(10px) scale(0.5)' },
                '20%': { opacity: 1, transform: 'translateY(0) scale(1.1)' },
                '100%': { opacity: 0, transform: 'translateY(-20px) scale(1)' }
              },
              lockOn: {
                '0%': { opacity: 0, transform: 'scale(2) rotate(45deg)' },
                '60%': { opacity: 1, transform: 'scale(0.8) rotate(0deg)' },
                '100%': { opacity: 1, transform: 'scale(1) rotate(0deg)' }
              },
              scanVertical: {
                '0%': { top: '0%', opacity: 0 },
                '10%': { opacity: 1 },
                '90%': { opacity: 1 },
                '100%': { top: '100%', opacity: 0 }
              },
              successFloat: {
                '0%': { transform: 'translate(0, 0) scale(1)' },
                '100%': { transform: 'translate(0, -60px) scale(0.9)', opacity: 0 }
              }
            },
            boxShadow: {
              'glow-blue': '0 0 20px -5px rgba(15, 23, 42, 0.1)',
              'glow-amber': '0 0 30px -5px rgba(220, 38, 38, 0.3)',
              'subtle': '0 1px 2px 0 rgba(0, 0, 0, 0.05)',
              'card': '0 4px 6px -1px rgba(0, 0, 0, 0.02), 0 2px 4px -1px rgba(0, 0, 0, 0.02)',
            }
          }
        }
      }
    </script>
    <style>
      body {
        background-color: #ffffff;
        color: #0f172a;
        font-family: 'Inter', sans-serif;
        overflow-x: hidden;
      }
      
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 10px;
        border: 2px solid #ffffff;
      }
      
      .glass-card {
        background: rgba(255, 255, 255, 0.7);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
      }
      
      .transform-style-3d {
        transform-style: preserve-3d;
      }

      .plasma-core {
        background: linear-gradient(90deg, #fff 0%, #60a5fa 50%, #fff 100%);
        box-shadow: 0 0 15px #3b82f6, 0 0 30px #2563eb;
      }
      
      .grid-floor {
        background-image: linear-gradient(0deg, transparent 24%, rgba(0, 0, 0, .05) 25%, rgba(0, 0, 0, .05) 26%, transparent 27%, transparent 74%, rgba(0, 0, 0, .05) 75%, rgba(0, 0, 0, .05) 76%, transparent 77%, transparent), linear-gradient(90deg, transparent 24%, rgba(0, 0, 0, .05) 25%, rgba(0, 0, 0, .05) 26%, transparent 27%, transparent 74%, rgba(0, 0, 0, .05) 75%, rgba(0, 0, 0, .05) 76%, transparent 77%, transparent);
        background-size: 50px 50px;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "lucide-react": "https://esm.sh/lucide-react@^0.563.0",
    "@google/genai": "https://esm.sh/@google/genai@^1.38.0",
    "react-dom": "https://esm.sh/react-dom@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "recharts": "https://esm.sh/recharts@^3.7.0"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body class="selection:bg-tva-orange selection:text-white">
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
