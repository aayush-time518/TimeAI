<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Time AI | Enterprise Intelligence</title>
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              mono: ['JetBrains Mono', 'monospace'],
            },
            colors: {
              tva: {
                dark: '#f8fafc', // Slate 50 - Ultra Light Background
                panel: '#ffffff', // Pure White
                amber: '#fbbf24', // Amber 400
                orange: '#2563eb', // PRIMARY BRAND COLOR (Blue)
                blue: '#3b82f6', // Blue 500 (Secondary)
                cream: '#0f172a', // Slate 900 (Primary Text)
                green: '#10b981', // Emerald 500
                void: '#020617', // Slate 950
              }
            },
            transitionTimingFunction: {
              'out-expo': 'cubic-bezier(0.19, 1, 0.22, 1)',
              'luxury': 'cubic-bezier(0.25, 1, 0.5, 1)', // Ultra smooth "Apple-like" ease
              'elastic': 'cubic-bezier(0.68, -0.55, 0.265, 1.55)',
              'fluid': 'cubic-bezier(0.3, 0, 0, 1)',
            },
            transitionDuration: {
              '400': '400ms',
              '800': '800ms',
              '2000': '2000ms',
            },
            animation: {
              'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
              'float': 'float 6s ease-in-out infinite',
              'scan': 'scan 8s linear infinite',
              'spin-slow': 'spin 60s linear infinite',
              'ear-idle': 'earIdle 3s ease-in-out infinite',
              'ear-alert': 'earAlert 0.4s ease-in-out infinite',
              'progress': 'progress 2s ease-in-out infinite',
              'flicker': 'flicker 2s infinite',
              'shimmer': 'shimmer 3s linear infinite',
              'enter-view': 'enterView 0.8s cubic-bezier(0.25, 1, 0.5, 1) forwards',
              'fade-up': 'fadeUp 0.6s cubic-bezier(0.25, 1, 0.5, 1) forwards',
            },
            keyframes: {
              enterView: {
                '0%': { opacity: 0, transform: 'translateY(10px) scale(0.99)', filter: 'blur(4px)' },
                '100%': { opacity: 1, transform: 'translateY(0) scale(1)', filter: 'blur(0)' },
              },
              fadeUp: {
                 '0%': { opacity: 0, transform: 'translateY(20px)' },
                 '100%': { opacity: 1, transform: 'translateY(0)' },
              },
              float: {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-20px)' },
              },
              scan: {
                '0%': { backgroundPosition: '0% 0%' },
                '100%': { backgroundPosition: '0% 100%' },
              },
              earIdle: {
                '0%, 100%': { transform: 'rotate(0deg)' },
                '50%': { transform: 'rotate(-10deg)' }, 
              },
              earAlert: {
                '0%, 100%': { transform: 'rotate(0deg)' },
                '25%': { transform: 'rotate(15deg)' },
                '75%': { transform: 'rotate(-5deg)' },
              },
              progress: {
                '0%': { transform: 'translateX(-100%)' },
                '50%': { transform: 'translateX(0%)' },
                '100%': { transform: 'translateX(100%)' },
              },
              flicker: {
                '0%, 100%': { opacity: 1 },
                '33%': { opacity: 0.8 },
                '34%': { opacity: 1 },
                '35%': { opacity: 0.1 },
                '36%': { opacity: 1 },
                '70%': { opacity: 0.7 },
                '71%': { opacity: 1 },
              },
              shimmer: {
                '0%': { backgroundPosition: '200% 0' },
                '100%': { backgroundPosition: '-200% 0' }
              }
            },
            boxShadow: {
              'glow-blue': '0 0 40px -10px rgba(37, 99, 235, 0.4)',
              'glow-orange': '0 0 40px -10px rgba(37, 99, 235, 0.5)',
              'retro': '4px 4px 0px 0px rgba(15, 23, 42, 1)',
              'subtle': '0 2px 10px rgba(0,0,0,0.03)',
            }
          }
        }
      }
    </script>
    <style>
      body {
        background-color: #f8fafc;
        color: #0f172a;
        font-family: 'Inter', sans-serif;
        overflow-x: hidden;
      }
      
      /* Modern Dot Matrix Background */
      .bg-grid {
        background-color: #f8fafc;
        background-image: radial-gradient(#cbd5e1 1px, transparent 1px);
        background-size: 32px 32px;
      }

      /* View Transition Utilities */
      .view-transition-container {
        animation: enterView 0.8s cubic-bezier(0.25, 1, 0.5, 1) forwards;
      }

      /* Clean Shadow Glows */
      .text-glow {
        text-shadow: 0 0 30px rgba(37, 99, 235, 0.2);
      }
      
      .glass-card {
        background: rgba(255, 255, 255, 0.7);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.6);
        box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.07);
      }
      
      /* Custom scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 10px;
        border: 2px solid #f8fafc;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #94a3b8;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "lucide-react": "https://esm.sh/lucide-react@^0.563.0",
    "@google/genai": "https://esm.sh/@google/genai@^1.38.0",
    "react-dom": "https://esm.sh/react-dom@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "recharts": "https://esm.sh/recharts@^3.7.0"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body class="bg-grid selection:bg-tva-orange selection:text-white">
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
